name: Prepare release manually

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/main.js
            manifest.json
            build/styles.css
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          draft: true
          generate_release_notes: true
          files: |
            build/main.js
            manifest.json
            build/styles.css
